name: quitanda

services:
  database:
    image: postgres:16-alpine 
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env (copie de .env.example)}
      POSTGRES_DB: ${DB_NAME:-quitanda}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db-init/10-restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - ./backend/db/bkt_quitanda.sql:/dump/bkt_quitanda.sql:ro
    networks:
      - quitanda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: quitanda-backend:latest
    restart: unless-stopped
    init: true 
    environment:
      DB_HOST: database 
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:senai}
      DB_NAME: ${DB_NAME:-quitanda}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy 
    networks:
      - quitanda-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-3000}}
    image: quitanda-frontend:latest
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: 
      - quitanda-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Rede própria para os três serviços (resolução de nomes: database, backend, frontend)
networks:
  quitanda-net:
    driver: bridge

# Volume nomeado com os dados do PostgreSQL
volumes:
  pgdata: